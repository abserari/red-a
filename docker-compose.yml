version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: red-a-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: red-a-2025
      MONGO_INITDB_DATABASE: stock_data
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    command: mongod --wiredTigerCacheSizeGB 2

  mongo-express:
    image: mongo-express:latest
    container_name: red-a-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: red-a-2025
      ME_CONFIG_MONGODB_URL: mongodb://admin:red-a-2025@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local